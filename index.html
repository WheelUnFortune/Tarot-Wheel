<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WheelUnFortune</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #e8e8e8;
            overflow: hidden;
        }
        h1 { font-size: 2rem; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); color: #d4af37; }
        .subtitle { font-size: 0.9rem; color: #a0a0a0; margin-bottom: 20px; }
        .wheel-container { position: relative; width: 350px; height: 350px; }
        .wheel { width: 100%; height: 100%; border-radius: 50%; position: relative; overflow: hidden; box-shadow: 0 0 50px rgba(212, 175, 55, 0.3); transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99); }
        .wheel-segment { 
            position: absolute; 
            width: 50%; 
            height: 50%; 
            transform-origin: 100% 100%; 
            left: 50%; 
            top: 0; 
            display: flex; 
            align-items: flex-end; 
            justify-content: center; 
            font-size: 14px; 
            font-weight: bold; 
            text-align: center; 
            padding-bottom: 10px;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
        }
        .wheel-segment span { 
            transform: rotate(0deg); 
            display: block;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
            margin-bottom: 5px;
        }
        .center-circle { 
            position: absolute; 
            width: 60px; 
            height: 60px; 
            background: linear-gradient(145deg, #d4af37, #b8941f); 
            border-radius: 50%; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            z-index: 10; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 24px; 
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5); 
        }
        .pointer { 
            position: absolute; 
            top: -20px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 0; 
            height: 0; 
            border-left: 20px solid transparent; 
            border-right: 20px solid transparent; 
            border-top: 40px solid #d4af37; 
            z-index: 20; 
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); 
        }
        .spin-btn { 
            margin-top: 30px; 
            padding: 15px 50px; 
            font-size: 1.3rem; 
            font-family: 'Georgia', serif; 
            background: linear-gradient(145deg, #d4af37, #b8941f); 
            color: #1a1a2e; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4); 
            transition: all 0.3s ease; 
        }
        .spin-btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6); }
        .spin-btn:active { transform: scale(0.98); }
        .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .result { 
            margin-top: 25px; 
            font-size: 1.5rem; 
            text-align: center; 
            min-height: 80px; 
            padding: 0 20px; 
        }
        .result .label { 
            font-size: 0.9rem; 
            color: #a0a0a0; 
            margin-bottom: 5px; 
        }
        .result .card-number { 
            font-size: 1.2rem; 
            color: #888; 
            margin-bottom: 5px;
        }
        .result .card-name { 
            font-size: 2rem; 
            color: #d4af37; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); 
        }
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
        .star { position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%; animation: twinkle 3s infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <h1>WheelUnFortune</h1>
    <p class="subtitle">Major Arcana + The Aces (26 Cards)</p>
    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel" id="wheel"></div>
        <div class="center-circle">☆</div>
    </div>
    <button class="spin-btn" id="spinBtn" onclick="spin()">SPIN</button>
    <div class="result" id="result">
        <div class="label">Your card:</div>
        <div class="card-name">Click SPIN to reveal</div>
    </div>
    <script>
        const tarotCards = [
            "The Fool", "The Magician", "The High Priestess", "The Empress", "The Emperor",
            "The Hierophant", "The Lovers", "The Chariot", "Strength", "The Hermit",
            "Wheel of Fortune", "Justice", "The Hanged Man", "Death", "Temperance",
            "The Devil", "The Tower", "The Star", "The Moon", "The Sun",
            "Judgement", "The World",
            "Ace of Wands", "Ace of Cups", "Ace of Swords", "Ace of Pentacles"
        ];
        const colors = ['#8B4513', '#A0522D', '#CD853F', '#D2691E', '#8B4513', '#A0522D', '#CD853F', '#D2691E', '#8B4513', '#A0522D', '#CD853F', '#D2691E', '#8B4513', '#A0522D'];
        let currentRotation = 0, isSpinning = false;
        
        function createWheel() { 
            const wheel = document.getElementById('wheel'), 
                  numSegments = tarotCards.length, 
                  anglePerSegment = 360 / numSegments; 
            
            for (let i = 0; i < numSegments; i++) {
                const segment = document.createElement('div'); 
                segment.className = 'wheel-segment'; 
                segment.style.backgroundColor = colors[i % colors.length]; 
                segment.style.transform = `translateX(-50%) rotate(${i * anglePerSegment}deg)`; 
                segment.innerHTML = `<span>${i + 1}</span>`; 
                wheel.appendChild(segment); 
            }
        }
        
        function spin() { 
            if (isSpinning) return; 
            isSpinning = true; 
            const btn = document.getElementById('spinBtn'); 
            btn.disabled = true; 
            btn.textContent = 'SPINNING...'; 
            document.getElementById('result').innerHTML = '<div class="label">Your card:</div><div class="card-name">...</div>'; 
            
            const numSegments = tarotCards.length, 
                  anglePerSegment = 360 / numSegments, 
                  randomSegment = Math.floor(Math.random() * numSegments), 
                  spins = 5 + Math.floor(Math.random() * 5), 
                  finalRotation = (spins * 360) + (randomSegment * anglePerSegment) + (anglePerSegment / 2); 
            
            currentRotation += finalRotation; 
            document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`; 
            
            setTimeout(() => { 
                const normalizedRotation = (360 - (currentRotation % 360)) % 360, 
                      winningIndex = Math.floor((normalizedRotation + (anglePerSegment / 2)) / anglePerSegment) % numSegments, 
                      winningCard = tarotCards[winningIndex],
                      cardNumber = winningIndex + 1;
                
                document.getElementById('result').innerHTML = `
                    <div class="label">Your card:</div>
                    <div class="card-number">Card #${cardNumber}</div>
                    <div class="card-name">${winningCard}</div>
                `; 
                isSpinning = false; 
                btn.disabled = false; 
                btn.textContent = 'SPIN AGAIN'; 
            }, 4000); 
        }
        
        function createStars() { 
            const starsContainer = document.getElementById('stars'); 
            for (let i = 0; i < 100; i++) { 
                const star = document.createElement('div'); 
                star.className = 'star'; 
                star.style.left = Math.random() * 100 + '%'; 
                star.style.top = Math.random() * 100 + '%'; 
                star.style.animationDelay = Math.random() * 3 + 's'; 
                starsContainer.appendChild(star); 
            } 
        }
        
        createWheel(); 
        createStars();
    </script>
</body>
</html>
